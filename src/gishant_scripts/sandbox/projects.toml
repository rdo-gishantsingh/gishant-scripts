# Canonical project key -> per-backend name mapping.
# The CLI --project flag accepts the canonical key (e.g. BARBIE_NUTCRACKER).
# storage: NAS folder name used to build the episode path on disk.
#          Defaults to shotgrid name if omitted.
# Add a new [projects.KEY] block for each project you need to manage.

[projects.SGAYONTEST]
shotgrid = "SGAYONTEST"
kitsu = "SGAYONTEST"
ayon = "SGAYONTEST"
storage = "SGAYONTEST"

[projects.WEDRO]
shotgrid = "WEDRO"
kitsu = "Wed Wabbit"
ayon = "Wed_Wabbit"
storage = "Wed_Wabbit"